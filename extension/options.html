<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture settings · Keepall</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <main class="app-frame">
      <header class="site-header">
        <div class="brand" aria-label="Keepall">
          <img src="icon-32.png" width="32" height="32" alt="">
          <span>keepall</span>
        </div>
      </header>

      <div class="page-content">
        <a id="library-link" class="back-link" href="https://keepall.app/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
          Open library
        </a>

        <div class="page-heading">
          <p class="eyebrow">Keepall</p>
          <h1>Capture settings</h1>
          <p class="intro">Choose which Keepall library receives links from this extension.</p>
        </div>

        <section class="settings-card" aria-labelledby="address-heading">
          <h2 id="address-heading">Library address</h2>
          <p class="section-description">Use your Keepall address, or a local development server while testing.</p>
          <form id="settings">
            <label for="origin">Keepall address</label>
            <input id="origin" type="url" required spellcheck="false" autocomplete="url" aria-describedby="origin-hint">
            <p id="origin-hint" class="hint">For local testing, enter the address shown by <code>pnpm dev</code>, such as <code>http://localhost:3001</code>.</p>
            <div class="form-footer">
              <button type="submit">Save address</button>
              <p id="status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
