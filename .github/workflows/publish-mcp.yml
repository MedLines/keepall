# Stages @keepall/mcp on npm with provenance when a tag like mcp-v1.0.1 is pushed. The maintainer then approves
# the staged version with 2FA (npmjs.com, or `npm stage approve <id>`), so nothing publishes without them.
# Uses npm trusted publishing (OIDC) with the "npm stage publish" permission, so no npm token is stored here.
# The repository variable KEEPALL_PUBLIC_RELAY_URL is baked into the package as its default relay.
name: Publish @keepall/mcp

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KEEPALL_PUBLIC_RELAY_URL: ${{ vars.KEEPALL_PUBLIC_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "mcp-v$(node -p "require('./packages/mcp/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm --filter @keepall/relay test
      - run: pnpm --filter @keepall/mcp typecheck
      - run: pnpm --filter @keepall/mcp test
      # Staged publishing needs npm 12.
      - run: npm install -g npm@12
      - working-directory: packages/mcp
        run: npm stage publish
